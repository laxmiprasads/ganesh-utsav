spring:
  application:
    name: ganesh-utsav-backend

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ganesh_utsav_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-to-a-long-random-secret-key-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-size: ${UPLOAD_MAX_SIZE:5242880}